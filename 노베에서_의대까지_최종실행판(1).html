function endCard(){
  var f=S.final,L=[];
  var t=UNI_TXT[f.u];if(t)L.push(t);
  if(f.d==='의예과')L.push('흰 가운을 입을 때까지 6년, 이제 첫 학기입니다.');
  else if(f.d==='초등교육과')L.push('교실에서 만날 아이들을 떠올리며 교육과 수업 실습을 준비합니다.');
  else if(S.major.kw.some(function(k){return f.d.indexOf(k)>=0}))L.push('희망했던 '+S.major.dept+' 계열에 합격해 처음 그린 진로 그대로 진학합니다.');
  else L.push('희망한 '+S.major.dept+'은(는) 아니지만 전공 탐색과 전과·복수전공이라는 길이 열려 있습니다.');
  if(S.dropped)L.push('자퇴와 검정고시, 스스로 선택한 길에서 거둔 합격입니다.');
  else if(S.fam)L.push(S.fam.nm+' 졸업생. 전국에서 모인 친구들과 경쟁한 3년이 큰 자산이 됐습니다.');
  if(S.n)L.push(S.n+'번의 겨울을 지나 얻은 합격입니다. 포기하지 않은 시간이 증거입니다.');
  else if(S.early)L.push('조기졸업으로 친구들보다 한 해 먼저 캠퍼스에 들어섭니다.');
  if(S.transferred)L.push('편입으로 얻은 자리라 학점 관리와 새 학교 적응이 다음 과제입니다.');
  if(S.zone&&S.zone.infra<=1&&f.v>=80)L.push('학원이 거의 없는 '+esc(S.region)+' '+esc(S.zone.name)+'에서 이룬 합격이라 주변의 축하가 더 큽니다.');
  else if(S.zone&&S.zone.infra>=3&&f.v>=93)L.push('학원가 불빛 아래 보낸 시간이 합격으로 이어졌습니다.');
  return '<div class="card"><p class="lab">합격 후일담</p>'+L.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
}
var AK='bench2admit_ach_v1',ACHS={};

 {n:'지방의 기적',d:'학원 인프라가 약한 지역에서 상위권 대학 합격',f:function(f){return S.zone.infra<=1&&f.v>=85}},

 {n:'과학도의 길',d:'과학고 출신',f:function(){return S.stype==='sci'}},
 {n:'내신 1점대',d:'내신 평균 1.9등급 이하',f:function(){var g=gpa();return g!==null&&g<=1.9}},

 {n:'희망 학과 합격',d:'처음 정한 학과로 진학',f:function(f){return S.major.kw.some(function(k){return f.d.indexOf(k)>=0})}},
 {n:'라이벌을 넘다',d:'라이벌보다 높은 수능 성적',f:function(){return !!(S.rivals&&S.csat)&&S.csat.avgPct>rivalFin(S.rivals[0])+3}}

function achGot(f){var got=ACH.filter(function(a){return a.f(f)});got.forEach(function(a){ACHS[a.n]=1});try{localStorage.setItem(AK,JSON.stringify(ACHS))}catch(e){}return got}
function achCard(f){
  var got=achGot(f);
  return '<div class="card"><h3>이번 판 업적</h3>'+(got.length?'<ul class="tr">'+got.map(function(a){return '<li><b>'+a.n+'</b><small>'+a.d+'</small></li>'}).join('')+'</ul>':'<p class="mute">이번 판에는 달성한 업적이 없습니다.</p>')+'</div>';

function achStart(){

function trail(f){
  var L=[],g=gpa(),p=S.csat?S.csat.avgPct:null;
  L.push('계열 '+trackName()+(S.sel?' · 선택과목 '+S.sel.join(', '):''));

  if(g!==null&&p!==null){var gt=cumPct(g),ct=100-p;L.push(gt+8<ct?'내신(누적 상위 '+f1(gt)+'%)이 수능(상위 '+f1(ct)+'%)보다 강한 내신형이었습니다.':ct+8<gt?'수능(상위 '+f1(ct)+'%)이 내신(누적 상위 '+f1(gt)+'%)보다 강한 수능형이었습니다.':'내신과 수능이 비슷한 균형형이었습니다.')}
  var hk=Object.keys(S.hakEver||{}).map(function(i){return HAKS[i]&&HAKS[i].n}).filter(Boolean).concat(Object.keys(S.passEver||{}).map(function(i){return BR[i]&&BR[i].n}).filter(Boolean));
  L.push(hk.length?'이용한 학원·인강: '+hk.join(', '):'학원·인강 없이 스스로 공부했습니다.');
  if(S.dropped)L.push('자퇴로 내신을 포기하고 수능에 집중했습니다.');

  if(S.early)L.push('고2에 조기졸업을 선택했습니다.');
